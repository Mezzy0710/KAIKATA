<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAIKATA — not packaged</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #FFF9EF;
    color: #1C1A17;
  }
  .cartforge-not-packaged {
    max-width: 440px;
    margin: 24px;
    padding: 24px 28px;
    background: #FFFFFF;
    border: 1.5px solid #DED3C2;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(28, 26, 23, 0.12);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #D84A2B;
  }
  p {
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 1.5;
  }
  code {
    display: block;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #F1EADF;
    font-size: 13px;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="cartforge-not-packaged">
    <h1>KAIKATA</h1>
    <p>This is the unpackaged source folder.</p>
    <p>Run <code>node scripts/package-extension.mjs</code> and load <code>dist/kaikata-extension</code> instead.</p>
  </div>
</body>
</html>
